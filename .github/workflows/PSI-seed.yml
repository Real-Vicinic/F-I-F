name: seed

on:
  workflow_dispatch:
    inputs:
      import_conditions:
        description: "Also import backend/data/conditions.csv (duplicates skipped)"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/src/requirements.txt
      - run: pip install -r src/requirements.txt
      - run: python scripts/migrate.py
      - run: python scripts/seed.py
      - name: Import conditions
        if: ${{ inputs.import_conditions }}
        run: python scripts/import_conditions.py data/conditions.csv
      - name: Remove duplicate conditions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          DELETE FROM test_conditions a USING test_conditions b
          WHERE a.id > b.id
            AND a.source = b.source
            AND a.investigation_id = b.investigation_id
            AND a.o2_pct IS NOT DISTINCT FROM b.o2_pct
            AND a.pressure_psi IS NOT DISTINCT FROM b.pressure_psi
            AND a.airflow_cm_s IS NOT DISTINCT FROM b.airflow_cm_s
            AND a.note IS NOT DISTINCT FROM b.note;"
