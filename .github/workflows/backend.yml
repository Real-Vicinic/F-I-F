name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency: backend

env:
  AWS_REGION: eu-west-1
  STAGE: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/migrate.py
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build
      - run: >
          sam deploy --config-env "$STAGE" --region "$AWS_REGION"
          --no-confirm-changeset --no-fail-on-empty-changeset
          --parameter-overrides "Stage=$STAGE" "DatabaseUrl=$DATABASE_URL"
          "GroqApiKeys=$GROQ_API_KEYS" "AllowedOrigin=*"
      - id: api
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "flame-in-freefall-$STAGE" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### API: $URL" >> "$GITHUB_STEP_SUMMARY"
      - run: python scripts/smoke_test.py
        env:
          API_URL: ${{ steps.api.outputs.url }}
