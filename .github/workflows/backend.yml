name: backend

on:
  push:
    branches: [develop, main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: backend-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || '*' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Migrate Neon
        run: python scripts/migrate.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build
      - name: Deploy
        run: >
          sam deploy --config-env "$STAGE" --no-confirm-changeset --no-fail-on-empty-changeset
          --region "${{ vars.AWS_REGION || 'eu-west-1' }}"
          --parameter-overrides "Stage=$STAGE" "DatabaseUrl=$DATABASE_URL" "GroqApiKeys=$GROQ_API_KEYS" "AllowedOrigin=$ALLOWED_ORIGIN"
      - name: API URL
        id: api
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "flame-in-freefall-$STAGE" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### $STAGE API: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        env:
          API_URL: ${{ steps.api.outputs.url }}
          SMOKE_CHAT: "1"
        run: python scripts/smoke_test.py
