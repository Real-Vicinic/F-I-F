<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flame in Freefall – Team UmbraOnxy</title>
<style>
:root{--d:#14161f;--l:#f6f3ee;--o:#ef6c1a;--b:#3d8bff;--g:#8a8f9e;--t:#1b1d27}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Calibri,Segoe UI,Arial,sans-serif}
#stage{position:fixed;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.s{position:absolute;inset:0;padding:56px 64px;display:none;background:var(--l);color:var(--t)}
.s.on{display:block}.s.dark{background:var(--d);color:#fff}
h1,h2{font-family:Cambria,Georgia,serif}
h2{font-size:42px;margin-bottom:34px}
.grid{display:grid;gap:20px}
.c{background:#fff;border:1px solid #e2ddd4;border-radius:12px;padding:22px 26px}
.dark .c{background:#1f2330;border-color:#2e3445}
.c h3{font-size:22px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.c h3:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--o);flex:none}
.c.b h3:before{background:var(--b)}
.c p{font-size:19px;line-height:1.45;color:#4a4e5c}.dark .c p{color:#c9cdd8}
.note{margin-top:22px;font-size:19px;font-style:italic;color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:34px}
.stats b{display:block;font-family:Cambria,Georgia,serif;font-size:78px;color:var(--o)}
.stats div:nth-child(even) b{color:var(--b)}.stats span{font-size:19px;color:#c9cdd8}
table{width:100%;border-collapse:collapse;font-size:20px;margin-bottom:26px}
th{background:var(--d);color:#fff;text-align:left;padding:11px 16px}
td{padding:11px 16px;border-bottom:1px solid #e2ddd4}tr:nth-child(odd) td{background:#fff}td:first-child{font-weight:700}
.bar{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:19px}
.bar i{display:block;height:26px;background:var(--o);border-radius:4px}.bar span:first-child{width:170px}
.try{background:#1f2330;padding:12px 18px;border-radius:8px;margin:10px 0;font-size:21px}
.hd{color:var(--o);font-weight:700;font-size:20px;margin-top:26px}
.title{display:flex;flex-direction:column;justify-content:center;height:100%}
.title h1{font-size:92px}.title h1 b{color:var(--o)}
.title p{font-size:32px;color:#c9cdd8;max-width:700px;margin:22px 0 40px}
.orb{position:absolute;right:120px;top:190px;width:340px;height:340px;border-radius:50%;border:5px solid var(--b);background:rgba(61,139,255,.2);display:grid;place-items:center}
.orb:after{content:"";width:150px;height:150px;border-radius:50%;background:var(--b);border:5px solid #bfd9ff}
.team b{color:var(--o);font-size:24px}.team{font-size:22px;line-height:1.6;color:#c9cdd8}
a{color:#7fb2ff;word-break:break-all}.n{position:absolute;right:30px;bottom:18px;color:var(--g);font-size:16px}
#bar{position:fixed;left:0;bottom:0;height:4px;background:var(--o);width:0;transition:width .2s}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:96px;border:0;border-radius:14px;background:rgba(239,108,26,.9);color:#fff;font-size:44px;line-height:1;cursor:pointer;z-index:5;box-shadow:0 4px 16px #0006;display:none}.nav:hover{background:#ff7d2e}#prev{left:6px}#next{right:6px}@media(max-width:700px){.nav{width:44px;height:72px;font-size:36px}}
#rot{display:none;position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#fffa;font:15px Arial;z-index:6}
#hint{position:fixed;right:12px;top:8px;color:#fff6;font:12px Arial}
</style></head><body>
<div id="stage"></div><div id="bar"></div><button class="nav" id="prev" aria-label="Previous slide">&#8249;</button><button class="nav" id="next" aria-label="Next slide">&#8250;</button><div id="rot">Rotate your phone sideways for a bigger slide</div><div id="hint">← → navigate · F fullscreen</div>
<script>
const card=(t,p,b,s='')=>`<div class="c ${b?'b':''}" style="${s}"><h3>${t}</h3><p>${p}</p></div>`;
const grid=(cols,items,extra='')=>`<div class="grid" style="grid-template-columns:${cols};${extra}">${items.map((x,i)=>card(x[0],x[1],i%2)).join('')}</div>`;
const S=[
{dark:1,h:`<div class="title"><h1>Flame in <b>Freefall</b></h1><p>SI-powered fire safety insights from NASA microgravity combustion data</p><div class="team"><b>Team UmbraOnxy</b><br>Miguel Nyobole (mrviinccileroy)<br>Lesego Mokoena (alondra_01)</div><div class="orb"></div></div>`},
{t:"Why fire in space is a different problem",h:grid("1fr 1fr",[["Fire is a mission-ending risk","Apollo 1 (1967): 100% O₂ cabin fire killed the crew. Apollo 13 (1970): O₂ tank explosion. Mir (1997): fire from an oxygen generator failure. Artemis II: a smoke alarm 80,000 miles out."],["The Moon makes it harder","Spacesuits run 100% O₂ at 4.3 psi. To cut pre-breathe time, Moon habitats and rovers are expected at 30%+ O₂ and ≤10.2 psi, over 40% more oxygen than Earth air, so materials burn more easily."],["Flames behave differently","No buoyancy means no rising hot gas. A teardrop becomes a sphere fed by diffusion, and common assumptions about spread and extinction stop holding."],["Data is hard to use","PSI holds decades of ISS combustion results, but they are hard to find, compare and interpret. There is no partial-gravity data yet."]])+`<p class="note">NASA's fire safety work: prevention · detection · suppression</p>`},
{t:"What the challenge asked for",h:grid("1fr 1fr",[["Build an SI-powered web dashboard","Summarize, rank and interpret NASA PSI combustion investigations."],["Find relevant investigations","For spacecraft, stations, Moon/Mars bases and pressurized rovers."],["Extract data for predictive modeling","Flammability and fire-scenario models for space exploration."],["Inform next-generation controls","Fire safety equipment, materials, detection and suppression."],["Show Earth applications (optional)","Water-mist extinguishers, smoke detectors, firefighter gear."],["Summarize and compare","Fuels, test conditions, variables, sensors, and differences between investigations."]])},
{dark:1,t:"Our answer: Flame in Freefall",h:`<div class="stats"><div><b>25</b><span>investigations curated from PSI</span></div><div><b>9</b><span>direct fire-safety investigations</span></div><div><b>6</b><span>crew environments modeled</span></div><div><b>17</b><span>fire variables mapped per test</span></div></div>`+grid("1fr 1fr 1fr",[["Explorer","Ranked table with filters (fuel, hardware, tier, focus), adjustable weights and side-by-side compare."],["Insights","Environment coverage, control areas, hardware families, data gaps, Earth applications, exports."],["Ask SI","Chat assistant answering only from indexed data, with clickable citations."]])},
{t:"How it is built",h:grid("1fr 1fr 1fr",[["React + Vite","Explorer, Insights, Detail, Compare, Chat. Ranking runs client-side so sliders re-rank instantly."],["AWS Lambda + API Gateway","Python 3.12 via SAM. Endpoints: investigations, compare, coverage, equipment, earth, export, chat, search."],["Neon Postgres","Investigations, experiments, test conditions, text chunks with a full-text search index."]])+grid("1fr 1fr",[["SI layer: grounded RAG","Retrieves matching chunks, then Groq (Llama 3.3 70B) answers from that context only, with citations. Rotating API keys; falls back to raw indexed facts if the model is down."],["Automation & quality","GitHub Actions deploy backend, frontend and database; a Playwright workflow harvests PSI pages. pytest suites for scoring and API plus a smoke test."]],"margin-top:20px")},
{t:"Objective 1: find what matters most",h:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px"><div><p style="font-weight:700;font-size:20px;margin-bottom:14px">Default ranking weights</p>${[["Fire relevance",.25],["Evidence",.2],["Variable coverage",.2],["Actionability",.15],["Atmosphere fit",.1],["Data richness",.1]].map(a=>`<div class="bar"><span>${a[0]}</span><i style="width:${a[1]*1000}px"></i><span>${a[1].toFixed(2)}</span></div>`).join('')}</div><div class="grid">${[["Six transparent factors","Users drag the weights; scores re-blend live. Re-rank resets to defaults."],["Tiers and focus","Direct / Related / Indirect tiers, plus Prevention, Detection or Suppression focus."],["Top results","BASS 0.83, BASS-II 0.73, FLEX-2 0.67, FLEX 0.64, then Saffire-I/II/III at 0.61."]].map((x,i)=>card(x[0],x[1],i==1)).join('')}</div></div>`},
{t:"Matching experiments to crew environments",h:`<table><tr><th>Environment</th><th>O₂</th><th>Pressure</th><th>Confirmed</th><th>Possible</th></tr><tr><td>Space station (ISS-like)</td><td>21%</td><td>14.7 psi</td><td>3</td><td>22</td></tr><tr><td>Moon Base / pressurized rover</td><td>30%</td><td>10.2 psi</td><td>2</td><td>1</td></tr><tr><td>Spacesuit</td><td>100%</td><td>4.3 psi</td><td>1</td><td>0</td></tr><tr><td>Crewed spacecraft, Mars base</td><td>assumed</td><td>assumed</td><td>3 / 2</td><td>22 / 1</td></tr></table>`+grid("1fr 1fr",[["Oxygen tested vs habitat","BASS tested 17–21% O₂, FLEX-2 10–40%, CFI-G up to 85%. Only CFI-G and FLEX-2 reach the Moon's 30%."],["Honest labeling","Each fit is Confirmed, Possible or Unknown. Mars and generic spacecraft atmospheres are not in the brief, so they are flagged as assumed."]])},
{t:"Objective 2: data ready for predictive modeling",h:grid("1fr 1fr 1fr",[["Variable coverage matrix","17 fire variables (fuel, O₂, diluent, pressure, flow, gravity, spread, extinction, products) derived per investigation."],["Compare view","Two investigations side by side. Same and differing fields are highlighted, with shared tags."],["Export","CSV and JSON of investigations and test conditions, filtered like the table."]])+grid("1fr 1fr",[["Test conditions","21 PSI test-condition rows (O₂, pressure, airflow) imported from PSI/NASA sources to fill metadata gaps."],["Data-gap tracker","Shows which investigations still lack O₂, pressure or airflow, and which need verifying in PSI."]],"margin-top:20px")},
{t:"Objective 3: controls, equipment and Earth impact",h:grid("1fr 1fr 1fr",[["Material selection","Flammability limits vs oxygen and airflow: BASS, BASS-II, Saffire."],["Atmosphere limits","How 30%+ O₂ raises flammability for Moon habitats."],["Smoke detection","SAME, SAME-R, DAFT: detect smoke, avoid dust false alarms."],["Suppression systems","FLEX, FLEX-2: CO₂ and helium dilution."],["Fire modeling","Validation data for simulations."],["Earth applications","Water-mist extinguishers, shuttle-derived smoke detectors, firefighter air tanks and clothing."]])+`<p class="note">Each control area lists the investigations that inform it, ordered by score.</p>`},
{dark:1,t:"The SI assistant: answers you can trace",h:grid("1fr 1fr",[["Grounded, not guessing","Instructed to answer only from retrieved PSI context, cite investigations like [BASS], and say \"I don't know\" when the data is silent."],["Resilient","Multiple Groq keys rotate to dodge rate limits. If the model fails, users still get the matching indexed facts."]])+`<div class="hd">Try asking</div>`+["Which experiments tested materials at 30%+ oxygen like the planned Moon Base?","Which investigations inform smoke detection?","How was fire suppression tested in microgravity?"].map(q=>`<div class="try">${q}</div>`).join('')},
{t:"Challenge vs. what we delivered",h:`<table><tr><th style="width:30%">Challenge need</th><th>How we tackled it</th></tr>${[["Hard to find","Filter by fuel, hardware, tier and O₂; full-text search; SI chat"],["Hard to compare","Side-by-side compare, variable matrix, hardware families"],["Hard to interpret","Fire physics reference, SI answers with citations, per-environment fit"],["Relevance to Moon/Mars","Six environments with confirmed / possible / assumed fit"],["Modeling data","CSV/JSON export, test conditions, gap tracker"],["Next-gen controls","Five control areas mapped to investigations"],["Earth applications","Spin-off cards linked to related investigations"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`},
{dark:1,t:"Honest limits and what comes next",h:grid("1fr 1fr",[["Known limits","No partial-gravity data in PSI yet. Mars and crewed-spacecraft atmospheres are assumed. No test reaches 100% O₂ spacesuit conditions. ISS findings may not transfer to exploration atmospheres. The app ranks curated metadata; raw measurements stay in PSI. Rocket combustion is out of scope."],["Next steps","Add Moon-gravity results from LUCI and FM2 when they land in PSI. Ingest raw measurements for modeling. Refine Mars and spacecraft atmospheres with NASA values. Expand test-condition coverage and verify flagged records."]])}
,
{dark:1,t:"Try it and explore the code",h:`<div class="grid" style="gap:22px">${[["Live site","https://flame-in-freefall.pages.dev/"],["Source code","https://github.com/Real-Vicinic/F-I-F/"],["Slides (PowerPoint)","https://github.com/Real-Vicinic/F-I-F/blob/main/docs/Flame_in_Freefall_Presentation.pptx"]].map((x,i)=>`<div class="c ${i==1?'b':''}"><h3>${x[0]}</h3><p><a href="${x[1]}" target="_blank" rel="noopener">${x[1]}</a></p></div>`).join('')}</div><p class="note" style="color:#c9cdd8">Team UmbraOnxy · Miguel Nyobole · Lesego Mokoena</p>`}
];
const st=document.getElementById('stage');
st.innerHTML=S.map((s,i)=>`<section class="s ${s.dark?'dark':''}">${s.t?`<h2>${s.t}</h2>`:''}${s.h}${i?`<div class="n">${i+1} / ${S.length}</div>`:''}</section>`).join('');
const el=[...st.children];let i=+(location.hash.slice(1))-1||0;
function show(n){i=Math.max(0,Math.min(el.length-1,n));el.forEach((e,k)=>e.classList.toggle('on',k==i));document.getElementById('prev').style.display=i>0?'block':'none';document.getElementById('next').style.display=i<el.length-1?'block':'none';document.getElementById('bar').style.width=((i+1)/el.length*100)+'%';history.replaceState(null,'','#'+(i+1))}
function fit(){const v=window.visualViewport,W=document.documentElement.clientWidth||innerWidth,H=Math.min(innerHeight,v?v.height:innerHeight),k=Math.min(W/1280,H/720);st.style.transform=`translate(${(W-1280*k)/2}px,${(H-720*k)/2}px) scale(${k})`;document.getElementById('rot').style.display=(W<H&&W<700)?'block':'none'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();show(i);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key))show(i+1);else if(['ArrowLeft','PageUp','Backspace'].includes(e.key))show(i-1);else if(e.key=='Home')show(0);else if(e.key=='End')show(el.length-1);else if(e.key=='f'||e.key=='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
addEventListener('click',e=>e.target.closest('a,.nav')||show(e.clientX>innerWidth/3?i+1:i-1));
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50){show(d<0?i+1:i-1);e.preventDefault()}});
</script></body></html>
