<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flame in Freefall – Team UmbraOnxy</title>
<style>
:root{--d:#14161f;--l:#f6f3ee;--o:#ef6c1a;--b:#3d8bff;--g:#8a8f9e;--t:#1b1d27}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Calibri,Segoe UI,Arial,sans-serif}
#stage{position:fixed;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.s{position:absolute;inset:0;padding:56px 64px;display:none;background:var(--l);color:var(--t)}
.s.on{display:block}.s.dark{background:var(--d);color:#fff}
h1,h2{font-family:Cambria,Georgia,serif}
h2{font-size:42px;margin-bottom:34px}
.grid{display:grid;gap:20px}
.c{background:#fff;border:1px solid #e2ddd4;border-radius:12px;padding:22px 26px}
.dark .c{background:#1f2330;border-color:#2e3445}
.c h3{font-size:22px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.c h3:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--o);flex:none}
.c.b h3:before{background:var(--b)}
.c p{font-size:19px;line-height:1.45;color:#4a4e5c}.dark .c p{color:#c9cdd8}
.note{margin-top:22px;font-size:19px;font-style:italic;color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:34px}
.stats b{display:block;font-family:Cambria,Georgia,serif;font-size:78px;color:var(--o)}
.stats div:nth-child(even) b{color:var(--b)}.stats span{font-size:19px;color:#c9cdd8}
table{width:100%;border-collapse:collapse;font-size:20px;margin-bottom:26px}
th{background:var(--d);color:#fff;text-align:left;padding:11px 16px}
td{padding:11px 16px;border-bottom:1px solid #e2ddd4}tr:nth-child(odd) td{background:#fff}td:first-child{font-weight:700}
.bar{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:19px}
.bar i{display:block;height:26px;background:var(--o);border-radius:4px}.bar span:first-child{width:170px}
.try{background:#1f2330;padding:12px 18px;border-radius:8px;margin:10px 0;font-size:21px}
.hd{color:var(--o);font-weight:700;font-size:20px;margin-top:26px}
.title{display:flex;flex-direction:column;justify-content:center;height:100%}
.title h1{font-size:92px}.title h1 b{color:var(--o)}
.title p{font-size:32px;color:#c9cdd8;max-width:700px;margin:22px 0 40px}
.orb{position:absolute;right:120px;top:190px;width:340px;height:340px;border-radius:50%;border:5px solid var(--b);background:rgba(61,139,255,.2);display:grid;place-items:center}
.orb:after{content:"";width:150px;height:150px;border-radius:50%;background:var(--b);border:5px solid #bfd9ff}
.team b{color:var(--o);font-size:24px}.team{font-size:22px;line-height:1.6;color:#c9cdd8}
a{color:#7fb2ff;word-break:break-all}.n{position:absolute;right:30px;bottom:18px;color:var(--g);font-size:16px}
#bar{position:fixed;left:0;bottom:0;height:4px;background:var(--o);width:0;transition:width .2s}
.nav{position:fixed;bottom:10px;width:84px;height:46px;border:0;border-radius:12px;background:rgba(239,108,26,.95);color:#fff;font-size:34px;line-height:1;cursor:pointer;z-index:5;display:none}.nav:hover{background:#ff7d2e}#prev{left:calc(50% - 96px)}#next{left:calc(50% + 12px)}
#rot{display:none;position:fixed;left:0;right:0;bottom:70px;text-align:center;color:#fffa;font:15px Arial;z-index:6}
#hint{position:fixed;right:12px;top:8px;color:#fff6;font:12px Arial}
</style></head><body>
<div id="stage"></div><div id="bar"></div><button class="nav" id="prev" aria-label="Previous slide">&#8249;</button><button class="nav" id="next" aria-label="Next slide">&#8250;</button><div id="rot">Rotate your phone sideways for a bigger slide</div><div id="hint">← → navigate · F fullscreen</div>
<script>
const card=(t,p,b,s='')=>`<div class="c ${b?'b':''}" style="${s}"><h3>${t}</h3><p>${p}</p></div>`;
const grid=(cols,items,extra='')=>`<div class="grid" style="grid-template-columns:${cols};${extra}">${items.map((x,i)=>card(x[0],x[1],i%2)).join('')}</div>`;
const S=[
{dark:1,h:`<div class="title"><h1>Flame in <b>Freefall</b></h1><p>SI-powered fire safety insights from NASA microgravity combustion data</p><div class="team"><b>Team UmbraOnxy</b><br>Miguel Nyobole (mrviinccileroy)<br>Lesego Mokoena (alondra_01)</div><div class="orb"></div></div>`},
{t:"The problem and what the challenge asked",h:grid("1fr 1fr",[["Why it matters","Apollo 1 (1967): a 100% O₂ cabin fire killed the crew. Apollo 13 and Mir show how fast oxygen systems fail. Moon habitats and rovers are expected at 30%+ O₂ and ≤10.2 psi, over 40% more oxygen than Earth air, so materials burn more easily. NASA's PSI database holds decades of ISS combustion results, but they are hard to find, compare and interpret, and it has no partial-gravity data yet."],["The challenge","Build an SI-powered web dashboard that summarizes, ranks and interprets PSI combustion investigations to: find those most relevant to spacecraft, the ISS, Moon/Mars bases and rovers; extract data for predictive fire modeling; inform next-generation safety controls and equipment; show Earth applications; and compare fuels, conditions, variables and sensors."]],"grid-auto-rows:1fr;font-size:1.1em")},
{dark:1,t:"Our answer: Flame in Freefall",h:`<div class="stats"><div><b>25</b><span>investigations curated from PSI</span></div><div><b>9</b><span>direct fire-safety investigations</span></div><div><b>6</b><span>crew environments modeled</span></div><div><b>17</b><span>fire variables mapped per test</span></div></div>`+grid("1fr 1fr 1fr",[["Explorer","Ranked table, filters, adjustable weights, side-by-side compare."],["Insights","Environment coverage, control areas, data gaps, Earth applications, exports."],["Ask SI","AI assistant answering only from indexed data, with citations."]])+`<p class="note">React + Vite · Python on AWS Lambda · Neon Postgres · Groq (gpt-oss-120b) · GitHub Actions</p>`},
{t:"Challenge vs. what we delivered",h:`<table><tr><th style="width:30%">Challenge need</th><th>How we tackled it</th></tr>${[["Hard to find","Filter by fuel, hardware, tier and O₂; full-text search; SI chat"],["Hard to compare","Side-by-side compare, 17-variable matrix, hardware families"],["Hard to interpret","Fire physics reference, SI answers with citations, per-environment fit"],["Relevance to Moon/Mars","Six environments with confirmed / possible / assumed fit"],["Modeling data","CSV/JSON export, 21 test-condition rows, data-gap tracker"],["Next-gen controls","Five control areas mapped to the investigations that inform them"],["Earth applications","Water-mist extinguishers, smoke detectors, firefighter gear"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`},
{t:"Ranking and environment fit",h:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px"><div><p style="font-weight:700;font-size:20px;margin-bottom:14px">Default ranking weights (adjustable)</p>${[["Fire relevance",.25],["Evidence",.2],["Variable coverage",.2],["Actionability",.15],["Atmosphere fit",.1],["Data richness",.1]].map(a=>`<div class="bar"><span>${a[0]}</span><i style="width:${a[1]*800}px"></i><span>${a[1].toFixed(2)}</span></div>`).join('')}</div><div><table style="font-size:17px"><tr><th>Environment</th><th>O₂</th><th>Psi</th><th>Conf.</th><th>Poss.</th></tr><tr><td>ISS-like</td><td>21%</td><td>14.7</td><td>3</td><td>22</td></tr><tr><td>Moon / rover</td><td>30%</td><td>10.2</td><td>2</td><td>1</td></tr><tr><td>Spacesuit</td><td>100%</td><td>4.3</td><td>1</td><td>0</td></tr><tr><td>Spacecraft, Mars*</td><td>—</td><td>—</td><td>3 / 2</td><td>22 / 1</td></tr></table><p style="font-size:14px;font-style:italic;color:#8a8f9e;margin:-14px 0 14px">*Assumed: not in the challenge brief.</p>${card("Top results","BASS 0.83, BASS-II 0.73, FLEX-2 0.67, FLEX 0.64, Saffire-I/II/III 0.61. Oxygen tested: BASS 17–21%, FLEX-2 10–40%, CFI-G up to 85%.",0,"padding:14px 20px")}</div></div>`},
{dark:1,t:"Honest limits, next steps and links",h:grid("1fr 1fr",[["Known limits","No partial-gravity data in PSI yet. Mars and spacecraft atmospheres are assumed. No test reaches 100% O₂ suit conditions. We rank curated metadata; raw measurements stay in PSI."],["Next steps","Add Moon-gravity results from LUCI and FM2 when they land in PSI. Ingest raw measurements for modeling. Refine Mars and spacecraft atmospheres. Verify flagged records."]])+`<div class="hd">Links</div><p style="font-size:22px;line-height:1.8;margin-top:8px"><b>Live site:</b> <a href="https://flame-in-freefall.pages.dev/" target="_blank" rel="noopener">https://flame-in-freefall.pages.dev/</a><br><b>Source code:</b> <a href="https://github.com/Real-Vicinic/F-I-F/" target="_blank" rel="noopener">https://github.com/Real-Vicinic/F-I-F/</a></p>`}
];
const st=document.getElementById('stage');
st.innerHTML=S.map((s,i)=>`<section class="s ${s.dark?'dark':''}">${s.t?`<h2>${s.t}</h2>`:''}${s.h}${i?`<div class="n">${i+1} / ${S.length}</div>`:''}</section>`).join('');
const el=[...st.children];let i=+(location.hash.slice(1))-1||0;
function show(n){i=Math.max(0,Math.min(el.length-1,n));el.forEach((e,k)=>e.classList.toggle('on',k==i));document.getElementById('prev').style.display=i>0?'block':'none';document.getElementById('next').style.display=i<el.length-1?'block':'none';document.getElementById('bar').style.width=((i+1)/el.length*100)+'%';history.replaceState(null,'','#'+(i+1))}
function fit(){const v=window.visualViewport,W=document.documentElement.clientWidth||innerWidth,H=Math.min(innerHeight,v?v.height:innerHeight)-68,k=Math.min(W/1280,H/720);st.style.transform=`translate(${(W-1280*k)/2}px,${Math.max(0,(H-720*k)/2)}px) scale(${k})`;document.getElementById('rot').style.display=(W<H&&W<700)?'block':'none'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();show(i);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key))show(i+1);else if(['ArrowLeft','PageUp','Backspace'].includes(e.key))show(i-1);else if(e.key=='Home')show(0);else if(e.key=='End')show(el.length-1);else if(e.key=='f'||e.key=='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
addEventListener('click',e=>e.target.closest('a,.nav')||show(e.clientX>innerWidth/3?i+1:i-1));
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50){show(d<0?i+1:i-1);e.preventDefault()}});
</script></body></html>
